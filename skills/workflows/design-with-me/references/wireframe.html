<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TodoMVC · 筛选位置三变体</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f5f5; color: #222; font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 24px; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .axis { color: #666; font-size: 14px; margin-bottom: 20px; }
  .axis strong { color: #222; }
  .picker { display: flex; gap: 8px; margin-bottom: 20px; }
  .picker button { padding: 8px 14px; border: 1px solid #888; background: white; font: inherit; cursor: pointer; }
  .picker button[aria-pressed="true"] { background: #222; color: white; border-color: #222; }
  .picker-hint { color: #888; font-size: 12px; margin: 0 0 20px; }
  .screen { padding: 28px 20px; border: 1px solid #aaa; background: white; }
  .title { margin-bottom: 32px; font-size: 30px; font-weight: 600; }
  .entry, .row, footer, nav { display: flex; align-items: center; gap: 12px; }
  .entry { margin-bottom: 24px; }
  .field { flex: 1; padding: 12px; border: 1px solid #aaa; color: #666; }
  .button { padding: 10px 14px; border: 1px solid #aaa; white-space: nowrap; }
  .list { border: 1px solid #aaa; }
  .row, footer { padding: 12px 16px; }
  .row + .row, footer { border-top: 1px solid #ddd; }
  .check { width: 16px; height: 16px; border: 1px solid #888; line-height: 14px; }
  .delete { margin-left: auto; } .done { text-decoration: line-through; color: #777; }
  footer { justify-content: space-between; flex-wrap: wrap; font-size: 13px; }
  nav { justify-content: center; margin: 20px 0 0; }
  .filter-top nav { justify-content: flex-start; margin: 0 0 24px; }
  .filter-first nav { justify-content: flex-start; margin: 0 0 16px; padding-bottom: 16px; border-bottom: 1px solid #ddd; }
  .note { color: #666; font-size: 13px; margin-top: 20px; }
  @media(max-width:760px) { main { padding: 0 16px; } }
</style>
<main>
  <h1>同一份待办，筛选放哪里</h1>
  <p class="axis"><strong>轴：筛选入口的位置。</strong>每个变体只在这一个维度上不同；列表、输入、其余结构完全一致。</p>
  <div class="picker" role="group" aria-label="方案切换">
    <button data-variant="bottom" aria-pressed="true">底部筛选</button>
    <button data-variant="top" aria-pressed="false">顶部筛选</button>
    <button data-variant="first" aria-pressed="false">筛选前置</button>
  </div>
  <p class="picker-hint">也可用 URL 参数切换：?variant=top</p>
  <div class="screen" id="screen"></div>
  <p class="note" id="note"></p>
</main>
<template id="base">
  <div class="title">待办事项</div>
  <div class="entry"><span class="field">接下来要做什么？</span><span class="button">添加</span></div>
  <div class="list">
    <div class="row"><span class="check"></span>买牛奶<span class="delete">×</span></div>
    <div class="row"><span class="check"></span>散步十分钟<span class="delete">×</span></div>
    <div class="row"><span class="check">✓</span><span class="done">给植物浇水</span><span class="delete">×</span></div>
    <footer><span>2 项未完成</span><span>清除已完成</span></footer>
  </div>
  <nav aria-label="筛选布局示意"><span class="button">全部</span><span>未完成</span><span>已完成</span></nav>
</template>
<script>
  const variants = {
    bottom: {
      note: '先输入和浏览，再筛选。列表变长后，筛选是否容易被发现？',
      place: (root) => root.append(root.querySelector('nav'))
    },
    top: {
      note: '筛选在入口上方：先选要看的任务。它是否打断了直接添加的动作？',
      place: (root) => root.querySelector('.entry').before(root.querySelector('nav'))
    },
    first: {
      note: '筛选作为页面第一层，把浏览和输入隔开。添加动作离标题更远了，值得吗？',
      place: (root) => {
        root.querySelector('.entry').before(root.querySelector('nav'));
        root.querySelector('nav').classList.add('filter-first');
      }
    }
  };
  function show(name) {
    const spec = variants[name];
    const root = document.importNode(document.querySelector('#base').content, true);
    spec.place(root);
    const screen = document.querySelector('#screen');
    screen.className = 'screen' + (name === 'bottom' ? '' : ' filter-top');
    screen.replaceChildren(root);
    document.querySelector('#note').textContent = spec.note;
    document.querySelectorAll('.picker button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.variant === name)));
    document.title = 'TodoMVC · 筛选位置三变体 · ' + name;
  }
  document.querySelectorAll('.picker button').forEach(b =>
    b.addEventListener('click', () => {
      const url = new URL(location);
      url.searchParams.set('variant', b.dataset.variant);
      history.replaceState(null, '', url);
      show(b.dataset.variant);
    }));
  show(new URLSearchParams(location.search).get('variant') || 'bottom');
</script>
</html>
